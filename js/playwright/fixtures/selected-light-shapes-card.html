<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Lightener Selected-Light Shapes Fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100vh;
      }
      body {
        background: #f2f4f8;
        color: #212121;
        font-family: Roboto, 'Segoe UI', sans-serif;
      }
      #root {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
        --primary-text-color: #212121;
        --secondary-text-color: #616161;
        --card-background-color: #fff;
        --ha-card-background: #fff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --ha-card-border-radius: 12px;
        --ha-card-box-shadow: none;
        --primary-color: #2563eb;
        --accent: #2563eb;
        --error-color: #db4437;
        --success-color: #2563eb;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      // Drive the SHIPPED bundle, exactly like the long-name fixture, so this is
      // a real-browser regression of the built card — not the TS source.
      import '../../../docs/lightener-curve-card.js';

      const LIGHTENER_ENTITY = 'light.lightener';
      const params = new URLSearchParams(window.location.search);
      const membershipScenario = params.get('membership') ?? 'default';
      const requestedCandidateCount = Number(params.get('candidates') ?? '100');
      const candidateContractResponse = await fetch('/tests/fixtures/candidate_lights_v1.json');
      if (!candidateContractResponse.ok) {
        throw new Error('Could not load the shared candidate-light contract fixture');
      }
      const candidateContract = await candidateContractResponse.json();
      const disabledEntityError = candidateContract.errors.disabled_entity;
      const disabledEntityMessage = (entityId) =>
        disabledEntityError.message_template.replace('{entity_id}', entityId);

      // A fresh group: every light at the equal-brightness default ({1:1,100:100}
      // -> [{0,0},{1,1},{100,100}]). The card should show the compact Shapes
      // empty state until a specific light is selected.
      const FRESH_DEFAULT = { 1: '1', 100: '100' };
      const entities = {
        'light.a': { brightness: { ...FRESH_DEFAULT } },
        'light.b': { brightness: { ...FRESH_DEFAULT } },
      };
      if (membershipScenario === 'exceptional') {
        entities['light.missing_member'] = { brightness: { ...FRESH_DEFAULT } };
      }

      function candidate(
        entityId,
        name,
        {
          available = true,
          areaId = null,
          areaName = null,
          hidden = false,
          disabled = false,
          missing = false,
        } = {}
      ) {
        return {
          entity_id: entityId,
          name,
          available,
          area_id: areaId,
          area_name: areaName,
          hidden,
          disabled,
          missing,
        };
      }

      const defaultCandidates = [
        candidate('light.a', 'Alpha', {
          areaId: 'living_room',
          areaName: 'Living room',
        }),
        candidate('light.b', 'Bravo', {
          areaId: 'bedroom',
          areaName: 'Bedroom',
        }),
        candidate('light.new', 'New light', {
          areaId: 'living_room',
          areaName: 'Living room',
        }),
      ];

      const exceptionalCandidates = [
        candidate('light.a', 'Alpha', {
          areaId: 'living_room',
          areaName: 'Living room',
        }),
        candidate('light.b', 'Bravo unavailable', {
          available: false,
          areaId: 'bedroom',
          areaName: 'Bedroom',
        }),
        candidate('light.missing_member', 'Missing member', {
          available: false,
          missing: true,
        }),
        candidate('light.new', 'New light', {
          areaId: 'living_room',
          areaName: 'Living room',
        }),
        candidate('light.unavailable_spare', 'Unavailable spare', {
          available: false,
          areaId: 'garage',
          areaName: 'Garage',
        }),
        candidate('light.hidden_lamp', 'Hidden lamp', {
          areaId: 'office',
          areaName: 'Office',
          hidden: true,
        }),
        candidate('light.disabled_lamp', 'Disabled lamp', {
          available: false,
          areaId: 'office',
          areaName: 'Office',
          disabled: true,
        }),
        candidate('light.hidden_disabled_lamp', 'Hidden disabled lamp', {
          available: false,
          areaId: 'garage',
          areaName: 'Garage',
          hidden: true,
          disabled: true,
        }),
      ];

      function scaleCandidates(count) {
        const boundedCount = Math.max(2, Math.min(2000, Math.floor(count)));
        const scaled = defaultCandidates.slice(0, 2);
        for (let index = 2; index < boundedCount; index += 1) {
          const hidden = index % 11 === 0;
          const disabled = index % 17 === 0;
          const available = index % 13 !== 0 && !disabled;
          const areaIndex = index % 5;
          scaled.push(
            candidate(
              `light.scale_${String(index).padStart(4, '0')}`,
              `Scale candidate ${String(index).padStart(4, '0')} with a deterministic long name`,
              {
                available,
                areaId: `area_${areaIndex}`,
                areaName: `Area ${areaIndex}`,
                hidden,
                disabled,
              }
            )
          );
        }
        return scaled;
      }

      const canonicalCandidates =
        membershipScenario === 'scale'
          ? scaleCandidates(requestedCandidateCount)
          : membershipScenario === 'default'
            ? defaultCandidates
            : exceptionalCandidates;
      const candidateById = new Map(canonicalCandidates.map((item) => [item.entity_id, item]));

      function servedCandidateResponse() {
        const lights = canonicalCandidates.map((item) => ({ ...item }));
        if (membershipScenario === 'legacy') {
          return {
            observed_controlled_entity_ids: Object.keys(entities),
            lights: lights.map(({ hidden, disabled, missing, ...legacy }) => legacy),
          };
        }
        if (membershipScenario === 'malformed') {
          const malformed = lights.find(
            (candidate) => candidate.entity_id === 'light.hidden_disabled_lamp'
          );
          if (!malformed) {
            throw new Error('Malformed-contract sentinel candidate is missing');
          }
          delete malformed.disabled;
        }
        return {
          capabilities: { candidate_state_metadata: 1 },
          observed_controlled_entity_ids: Object.keys(entities),
          lights,
        };
      }

      window.__LIGHTENER_WS_CALLS__ = [];
      window.__LIGHTENER_SERVICE_CALLS__ = [];
      window.__LIGHTENER_SAVED__ = [];
      window.__LIGHTENER_MEMBERSHIP_CANDIDATES__ = canonicalCandidates;
      window.__LIGHTENER_FORCE_DISABLED_ENTITY__ = null;

      const states = {
        [LIGHTENER_ENTITY]: { state: 'on', attributes: { friendly_name: 'Lightener' } },
        'light.a': { state: 'on', attributes: { friendly_name: 'Alpha', brightness: 255 } },
        'light.b': {
          state: membershipScenario === 'exceptional' ? 'unavailable' : 'on',
          attributes: { friendly_name: 'Bravo', brightness: 255 },
        },
        'light.new': {
          state: 'on',
          attributes: { friendly_name: 'New light', brightness: 255 },
        },
        'light.unavailable_spare': {
          state: 'unavailable',
          attributes: { friendly_name: 'Unavailable spare' },
        },
        'light.hidden_lamp': {
          state: 'on',
          attributes: { friendly_name: 'Hidden lamp', brightness: 255 },
        },
      };
      const hass = {
        user: { is_admin: true },
        locale: { language: 'en' },
        states,
        callWS: async (msg) => {
          window.__LIGHTENER_WS_CALLS__.push(JSON.parse(JSON.stringify(msg)));
          if (msg.type === 'lightener/list_entities') {
            return { entities: [{ entity_id: LIGHTENER_ENTITY, name: 'Lightener' }] };
          }
          if (msg.type === 'lightener/get_curves') {
            return { entities };
          }
          if (msg.type === 'lightener/list_candidate_lights') {
            return servedCandidateResponse();
          }
          if (msg.type === 'lightener/save_curves') {
            // Record the payload so the spec can assert the audition never changed it.
            window.__LIGHTENER_SAVED__.push(JSON.parse(JSON.stringify(msg.curves)));
            Object.keys(entities).forEach((entityId) => delete entities[entityId]);
            Object.assign(entities, JSON.parse(JSON.stringify(msg.curves)));
            return {};
          }
          if (msg.type === 'lightener/set_controlled_lights') {
            const before = Object.keys(entities);
            const selected = msg.controlled_entity_ids;
            const disabledEntity = selected.find(
              (entityId) =>
                !before.includes(entityId) &&
                (candidateById.get(entityId)?.disabled ||
                  window.__LIGHTENER_FORCE_DISABLED_ENTITY__ === entityId)
            );
            if (disabledEntity) {
              const error = new Error(disabledEntityMessage(disabledEntity));
              error.code = disabledEntityError.code;
              throw error;
            }
            const next = Object.fromEntries(
              selected.map((entityId) => [
                entityId,
                entities[entityId] ?? { brightness: { ...FRESH_DEFAULT } },
              ])
            );
            Object.keys(entities).forEach((entityId) => delete entities[entityId]);
            Object.assign(entities, next);
            for (const entityId of selected) {
              const metadata = candidateById.get(entityId);
              hass.states[entityId] = hass.states[entityId] ?? {
                state: 'on',
                attributes: {
                  friendly_name: metadata?.name ?? entityId,
                  brightness: 255,
                },
              };
            }
            return {
              entities,
              added_entity_ids: selected.filter((entityId) => !before.includes(entityId)),
              removed_entity_ids: before.filter((entityId) => !selected.includes(entityId)),
            };
          }
          throw new Error(`Unexpected callWS message type: ${String(msg.type)}`);
        },
        callApi: async () => undefined,
        callService: async (...args) => {
          window.__LIGHTENER_SERVICE_CALLS__.push(args);
          return undefined;
        },
      };

      async function waitForFixture(card) {
        await card.updateComplete;
        const graph = card.renderRoot.querySelector('curve-graph');
        await graph?.updateComplete;
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      }

      window.__LIGHTENER_CARD_READY__ = (async () => {
        await customElements.whenDefined('lightener-curve-card');
        const card = document.createElement('lightener-curve-card');
        card.setConfig({
          type: 'custom:lightener-curve-card',
          entity: LIGHTENER_ENTITY,
          title: 'Brightness shapes',
        });
        card.hass = hass;
        document.getElementById('root').append(card);
        await waitForFixture(card);
        window.__LIGHTENER_CARD_ELEMENT__ = card;
      })();
    </script>
  </body>
</html>
